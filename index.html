<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="메모">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>메모 & 링크</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #8b919c;
    --accent: #5b8cff;
    --done: #4caf70;
    --danger: #e05a5a;
    --gap: 6px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .tab {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    font-weight: 600;
    padding: 10px 0;
    border-radius: 10px;
  }
  .tab.active {
    background: var(--panel);
    color: var(--text);
  }
  .tab .count {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 4px;
  }

  /* List */
  .list {
    flex: 1;
    touch-action: pan-y pinch-zoom;
    overflow-y: auto;
    padding: 10px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 12px;
    margin-bottom: var(--gap);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    user-select: none;
    -webkit-user-select: none;
  }
  .del-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    width: 36px;
    height: 36px;
    margin: -8px -6px -8px 0;
    border-radius: 8px;
  }
  .del-btn:active {
    color: var(--danger);
    background: rgba(224, 90, 90, 0.12);
  }
  .empty-hint {
    color: var(--muted);
    font-size: 14px;
    padding: 40px 12px;
    text-align: center;
    line-height: 1.6;
  }

  /* Links */
  .link-item { transition: background 0.15s, border-color 0.15s; }
  .link-item:active { border-color: var(--accent); }
  .link-item.copied {
    border-color: var(--done);
    background: rgba(76, 175, 112, 0.12);
  }
  .link-body { flex: 1; min-width: 0; }
  .link-text {
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .link-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }

  /* Todos */
  .todo-item { align-items: flex-start; position: relative; }
  .todo-item.dragging {
    z-index: 10;
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .todo-item.shifting { transition: transform 0.15s; }
  .drag-handle {
    flex-shrink: 0;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    margin: -8px 0 -8px -6px;
    padding: 8px 6px;
    touch-action: none;
  }
  .todo-order {
    flex-shrink: 0;
    min-width: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding-top: 2px;
  }
  .todo-checkbox {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: var(--done);
  }
  .todo-text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .todo-item.done .todo-text {
    text-decoration: line-through;
    color: var(--muted);
  }

  /* Composer */
  .add-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .add-row input {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 16px; /* 16px+ prevents iOS zoom on focus */
    outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 18px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
  }
  .add-row button:active { opacity: 0.8; }

  .toast {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 84px);
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--done);
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { background: var(--danger); }
</style>
</head>
<body>
<div class="tabs">
  <button class="tab" data-tab="links">링크<span class="count" id="linkCount"></span></button>
  <button class="tab" data-tab="todos">할 일<span class="count" id="todoCount"></span></button>
</div>

<div class="list" id="list"></div>

<form class="add-row" id="addForm">
  <input type="text" id="addInput" autocomplete="off" enterkeyhint="done">
  <button type="submit">추가</button>
</form>

<div class="toast" id="toast"></div>

<script>
const LINKS_KEY = 'memo_app_links';
const TODOS_KEY = 'memo_app_todos';
const TAB_KEY = 'memo_app_tab';

let links = JSON.parse(localStorage.getItem(LINKS_KEY) || '[]');
let todos = JSON.parse(localStorage.getItem(TODOS_KEY) || '[]');
let tab = localStorage.getItem(TAB_KEY) || 'links';

const listEl = document.getElementById('list');
const inputEl = document.getElementById('addInput');

function saveLinks() { localStorage.setItem(LINKS_KEY, JSON.stringify(links)); }
function saveTodos() { localStorage.setItem(TODOS_KEY, JSON.stringify(todos)); }

function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1200);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function setTab(next) {
  tab = next;
  localStorage.setItem(TAB_KEY, tab);
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  inputEl.placeholder = tab === 'links' ? '링크(URL) 붙여넣기' : '할 일 입력';
  inputEl.type = tab === 'links' ? 'url' : 'text';
  render();
}

function render() {
  document.getElementById('linkCount').textContent = links.length || '';
  document.getElementById('todoCount').textContent = todos.filter((t) => !t.done).length || '';
  listEl.innerHTML = '';
  if (tab === 'links') renderLinks(); else renderTodos();
}

// ---------- Links ----------

function renderLinks() {
  if (links.length === 0) {
    listEl.innerHTML = '<div class="empty-hint">저장된 링크가 없어요<br>아래에 링크를 붙여넣고 추가하세요</div>';
    return;
  }
  links.forEach((link, idx) => {
    const item = document.createElement('div');
    item.className = 'item link-item';
    item.innerHTML = `
      <div class="link-body">
        <div class="link-text">${escapeHtml(link)}</div>
        <div class="link-hint">탭하면 복사</div>
      </div>
      <button class="del-btn" aria-label="삭제">×</button>
    `;
    item.addEventListener('click', () => copyLink(link, item));
    item.querySelector('.del-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      links.splice(idx, 1);
      saveLinks();
      render();
    });
    listEl.appendChild(item);
  });
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  return ok ? Promise.resolve() : Promise.reject();
}

function copyLink(link, item) {
  const copy = navigator.clipboard
    ? navigator.clipboard.writeText(link).catch(() => fallbackCopy(link))
    : fallbackCopy(link);
  copy.then(() => {
    item.classList.add('copied');
    showToast('링크 복사됨');
    if (navigator.vibrate) navigator.vibrate(15);
    setTimeout(() => item.classList.remove('copied'), 500);
  }).catch(() => showToast('복사 실패', true));
}

function addLink(val) {
  links.push(val);
  saveLinks();
}

// ---------- Todos ----------

function renderTodos() {
  if (todos.length === 0) {
    listEl.innerHTML = '<div class="empty-hint">할 일이 없어요<br>≡ 를 잡고 끌면 순서를 바꿀 수 있어요</div>';
    return;
  }
  todos.forEach((todo, idx) => {
    const item = document.createElement('div');
    item.className = 'item todo-item' + (todo.done ? ' done' : '');
    item.innerHTML = `
      <span class="drag-handle" aria-label="순서 변경">≡</span>
      <span class="todo-order">${idx + 1}</span>
      <input type="checkbox" class="todo-checkbox" ${todo.done ? 'checked' : ''}>
      <span class="todo-text">${escapeHtml(todo.text)}</span>
      <button class="del-btn" aria-label="삭제">×</button>
    `;
    item.querySelector('.todo-checkbox').addEventListener('change', (e) => {
      todos[idx].done = e.target.checked;
      saveTodos();
      render();
    });
    item.querySelector('.del-btn').addEventListener('click', () => {
      todos.splice(idx, 1);
      saveTodos();
      render();
    });
    item.querySelector('.drag-handle').addEventListener('pointerdown', (e) => startDrag(e, idx));
    listEl.appendChild(item);
  });
}

// Touch/mouse reordering via the ≡ handle (HTML5 drag-and-drop doesn't work on mobile).
function startDrag(e, fromIdx) {
  e.preventDefault();
  const handle = e.currentTarget;
  handle.setPointerCapture(e.pointerId);
  const items = [...listEl.querySelectorAll('.todo-item')];
  const rects = items.map((el) => el.getBoundingClientRect());
  const dragged = items[fromIdx];
  const gap = parseFloat(getComputedStyle(dragged).marginBottom);
  const shift = rects[fromIdx].height + gap;
  const startY = e.clientY;
  let toIdx = fromIdx;

  dragged.classList.add('dragging');
  items.forEach((el, i) => { if (i !== fromIdx) el.classList.add('shifting'); });

  function onMove(ev) {
    const dy = ev.clientY - startY;
    dragged.style.transform = `translateY(${dy}px)`;
    const center = rects[fromIdx].top + rects[fromIdx].height / 2 + dy;
    toIdx = fromIdx;
    rects.forEach((r, i) => {
      const mid = r.top + r.height / 2;
      if (i < fromIdx && center < mid) toIdx = Math.min(toIdx, i);
      if (i > fromIdx && center > mid) toIdx = Math.max(toIdx, i);
    });
    items.forEach((el, i) => {
      if (i === fromIdx) return;
      let t = 0;
      if (i >= toIdx && i < fromIdx) t = shift;
      if (i <= toIdx && i > fromIdx) t = -shift;
      el.style.transform = t ? `translateY(${t}px)` : '';
    });
  }

  function onEnd() {
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onEnd);
    handle.removeEventListener('pointercancel', onEnd);
    if (toIdx !== fromIdx) {
      const moved = todos.splice(fromIdx, 1)[0];
      todos.splice(toIdx, 0, moved);
      saveTodos();
      if (navigator.vibrate) navigator.vibrate(10);
    }
    render();
  }

  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onEnd);
  handle.addEventListener('pointercancel', onEnd);
}

function addTodo(val) {
  todos.push({ text: val, done: false });
  saveTodos();
}

// ---------- Wiring ----------

// Swipe between tabs without interfering with scrolling or the reorder handle.
let swipe = null;
let suppressClickUntil = 0;
listEl.addEventListener('pointerdown', (e) => {
  suppressClickUntil = 0;
  if (!e.isPrimary) { swipe = null; return; }
  if (e.pointerType === 'mouse' || e.target.closest('input, button, .drag-handle')) return;
  swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, axis: null };
});
listEl.addEventListener('pointermove', (e) => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = Math.abs(e.clientX - swipe.x);
  const dy = Math.abs(e.clientY - swipe.y);
  if (!swipe.axis && Math.max(dx, dy) >= 12) {
    swipe.axis = dx > dy * 1.5 ? 'horizontal' : 'vertical';
    if (swipe.axis === 'horizontal') listEl.setPointerCapture(e.pointerId);
  }
});
listEl.addEventListener('pointerup', (e) => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const gesture = swipe;
  swipe = null;
  const dx = e.clientX - gesture.x;
  const dy = e.clientY - gesture.y;
  if (gesture.axis !== 'horizontal') return;
  suppressClickUntil = Date.now() + 500;
  if (Math.abs(dx) < 60 || Math.abs(dx) <= Math.abs(dy) * 1.5) return;
  const next = dx < 0 ? 'todos' : 'links';
  if (next !== tab) setTab(next);
});
listEl.addEventListener('pointercancel', () => { swipe = null; });
listEl.addEventListener('lostpointercapture', (e) => {
  // Touch initially captures the child under the finger. Moving capture to the
  // list emits a bubbling loss event from that child; the swipe is still active.
  if (e.target === listEl && swipe && e.pointerId === swipe.id) swipe = null;
});
listEl.addEventListener('click', (e) => {
  if (Date.now() < suppressClickUntil) {
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}, true);

document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));

document.getElementById('addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const val = inputEl.value.trim();
  if (!val) return;
  if (tab === 'links') addLink(val); else addTodo(val);
  inputEl.value = '';
  render();
  listEl.scrollTop = listEl.scrollHeight;
});

// Android "공유" → this app: save the shared link (manifest share_target).
(function handleShare() {
  const params = new URLSearchParams(location.search);
  const shared = params.get('url') || params.get('text') || params.get('title');
  if (!shared) return;
  const match = shared.match(/https?:\/\/\S+/);
  addLink(match ? match[0] : shared.trim());
  tab = 'links';
  history.replaceState(null, '', location.pathname);
  setTimeout(() => showToast('공유된 링크 저장됨'), 300);
})();

setTab(tab);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
